[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-sdk"
version = "1.0.0-alpha.1"
description = "Python SDK for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dennisyu" }]
dependencies = [
  "pydantic>=2.12,<3",
  "deepseek-harness-runtime-bin==1.0.0-alpha.1",
]

[project.urls]
Homepage = "https://github.com/Dennisdan1104/FinDeck"
Documentation = "https://github.com/Dennisdan1104/FinDeck/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/Dennisdan1104/FinDeck/issues"
Source = "https://github.com/Dennisdan1104/FinDeck"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
deepseek-harness-runtime-bin = { path = "../sdk-runtime", editable = true }
