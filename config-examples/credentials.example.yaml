# FinDeck 凭据模板
# ---------------------------------------------------------------
# 复制本文件为 ~/.findeck/.credentials.yaml
# （Windows: C:\Users\<你>\.findeck\.credentials.yaml）
# 只放"用到的"字段；明文保存，注意不要提交到任何仓库。
# ---------------------------------------------------------------

# 场景 A：DeepSeek 官方
DEEPSEEK_API_KEY: ""

# 场景 B：OpenAI 兼容网关（名字须与 settings.yaml 里 apiKeyEnv 一致）
MY_GATEWAY_API_KEY: ""

# 场景 C：本地服务不校验 key 时填占位值即可
LOCAL_OLLAMA_API_KEY: "local-no-key"
