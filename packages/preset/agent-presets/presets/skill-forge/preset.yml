name: 技能创作模式
description: 把过往对话蒸馏成可复用技能：读转录、提炼套路、访谈确认、起草 SKILL.md 并校验落盘。
order: 5
mode_kind: work
flow:
  steps:
    - id: read
      label: 读转录
      model: default
      prompt: |-
        完整读完每一份转录文件，包括失败、返工与纠正的片段——被否定的做法同样是要沉淀的经验。
    - id: distill
      label: 提炼
      model: default
      prompt: |-
        找出其中可复用的工作流、约定与踩坑结论：未来 agent 知道什么，就能一次把这类活做对。
    - id: interview
      label: 访谈确认
      model: default
      prompt: |-
        用 ask_user_question 确认要沉淀的工作流、技能名，以及转录中含糊之处；最多 3 个问题，用用户自己的语言提问。
    - id: draft
      label: 起草
      model: default
      prompt: |-
        写出 SKILL.md：frontmatter 的 description 中文在前、English: 在后，正文具体、祈使、只写转录真正支持的做法。
    - id: verify
      label: 校验落盘
      model: default
      prompt: |-
        核对 kebab-case 命名不与现有技能冲突、frontmatter 三个字段齐全、正文可照着执行，再写入用户技能根目录。
