# Opt-in Schedule patch over the shipped Web composition. The base bundle
# already mounts the `schedule` host service under that id, so this overlay only
# inserts the browser time-zone source and enables the Schedule page. The page
# lists only roots published after this overlay loads.

- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

- id: ui-schedule
  disabled: false
